
<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI藥品拍照辨識</title>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: white;
    text-align: center;
    font-family: sans-serif;
}

#cameraBox {
    position: relative;
    width: 100vw;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: black;
}

video, canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

video {
    object-fit: cover;
}

canvas {
    object-fit: contain;
}

#count {
    font-size: 26px;
    margin: 15px;
}

button {
    margin: 8px;
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
}

.actionButtons {
    display: flex;
    width: 100%;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
}

.actionButtons button {
    flex: 1;
    margin: 0;
    padding: 10px 5px;
    font-size: 16px;
    white-space: nowrap;
}

.setting {
    margin: 10px;
}

.settingTitle {
    font-size: 18px;
    margin-bottom: 6px;
}

.colorBtn {
    width: 42px;
    height: 32px;
    margin: 3px;
    padding: 0;
    border: 2px solid white;
    border-radius: 6px;
    cursor: pointer;
}

.colorBtn.red {
    background: #ff0000;
}

.colorBtn.green {
    background: #00cc00;
}

.colorBtn.yellow {
    background: #ffff00;
}

.optionBtn {
    margin: 3px;
    padding: 6px 12px;
    font-size: 15px;
    border: 2px solid white;
    border-radius: 6px;
    cursor: pointer;
    background: #333;
    color: white;
}

.selected {
    border: 3px solid #00ffff !important;
    box-shadow: 0 0 7px #00ffff;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
</head>

<body>

<!-- 相機 -->
<div id="cameraBox">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="canvas"></canvas>

</div>

<!-- 藥品數量 -->
<div id="count">
    藥品數量:0 顆
</div>

<!-- 標記顏色 -->
<div class="setting">

    <div class="settingTitle">
        標記顏色
    </div>

    <button
        class="colorBtn red selected"
        onclick="selectColor('red', this)"
        title="紅色">
    </button>

    <button
        class="colorBtn green"
        onclick="selectColor('#00cc00', this)"
        title="綠色">
    </button>

    <button
        class="colorBtn yellow"
        onclick="selectColor('#ffff00', this)"
        title="黃色">
    </button>

</div>

<!-- 標記大小 -->
<div class="setting">

    <div class="settingTitle">
        標記大小
    </div>

    <button
        class="optionBtn"
        onclick="selectSize(2, this)">
        2
    </button>

    <button
        class="optionBtn selected"
        onclick="selectSize(4, this)">
        4
    </button>

    <button
        class="optionBtn"
        onclick="selectSize(6, this)">
        6
    </button>

</div>

<!-- 操作按鈕 -->
<div class="actionButtons">

    <button onclick="startCamera()">
        開啟相機
    </button>

    <button onclick="capture()">
        拍照辨識
    </button>

    <button onclick="resetCamera()">
        重新拍攝
    </button>

</div>


<script>

/* =======================
   ONNX Runtime
======================= */

ort.env.wasm.wasmPaths =
"https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";


/* =======================
   全域變數
======================= */

let session = null;

let stream = null;

let locked = false;

let cameraActive = false;

let isPageHidden = false;

let selectedColor = "red";

let selectedSize = 4;

let detectedPoints = [];

let originalPhoto = null;


/* =======================
   DOM
======================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const countElement =
document.getElementById("count");


/* =======================
   載入 AI 模型
======================= */

async function loadModel() {

    if (session) return;

    session =
    await ort.InferenceSession.create(
        "model.onnx",
        {
            executionProviders: ["wasm"]
        }
    );

}


/* =======================
   開啟相機串流
======================= */

async function openCameraStream() {

    const newStream =
    await navigator.mediaDevices.getUserMedia({

        video: {
            facingMode: {
                ideal: "environment"
            },

            width: {
                ideal: 1280
            },

            height: {
                ideal: 720
            }
        },

        audio: false

    });

    // 先取得新串流，再替換舊串流

    const oldStream = stream;

    stream = newStream;

    video.srcObject = newStream;

    await video.play();

    cameraActive = true;

    // 停止舊串流

    if (oldStream && oldStream !== newStream) {

        oldStream.getTracks().forEach(track => {
            track.stop();
        });

    }

}


/* =======================
   等待相機畫面準備完成
======================= */

async function waitForVideoReady() {

    const startTime = Date.now();

    while (Date.now() - startTime < 5000) {

        if (
            video.readyState >= 2 &&
            video.videoWidth > 0 &&
            video.videoHeight > 0
        ) {

            return true;

        }

        await new Promise(resolve => {
            requestAnimationFrame(resolve);
        });

    }

    return false;

}


/* =======================
   確認相機是否正常
======================= */

async function ensureCameraReady() {

    if (!cameraActive) {

        throw new Error("相機尚未開啟");

    }

    // 檢查串流是否存在及是否已停止

    const tracks =
    stream ? stream.getVideoTracks() : [];

    const trackEnded =
    tracks.length === 0 ||
    tracks.some(track => track.readyState === "ended");

    if (trackEnded) {

        console.log("相機串流已停止，重新開啟");

        await openCameraStream();

    } else {

        try {

            if (video.srcObject !== stream) {

                video.srcObject = stream;

            }

            await video.play();

        }
        catch(error) {

            console.log("恢復相機播放", error);

        }

    }

    // 等待瀏覽器重新提供有效畫面

    const ready = await waitForVideoReady();

    if (!ready) {

        throw new Error("相機畫面尚未準備完成");

    }

}


/* =======================
   開啟相機
======================= */

async function startCamera() {

    try {

        if (locked) return;

        await loadModel();

        await openCameraStream();

        console.log(
            "相機解析度:",
            video.videoWidth,
            video.videoHeight
        );

    }
    catch(error) {

        console.error(error);

        alert(
            "無法開啟相機，請確認瀏覽器已允許相機權限。"
        );

    }

}


/* =======================
   監控頁面切換
======================= */

document.addEventListener(
    "visibilitychange",
    async function() {

        if (document.hidden) {

            isPageHidden = true;

            return;

        }

        isPageHidden = false;

        // 只有原本已經開啟相機才恢復

        if (cameraActive && !locked) {

            try {

                await ensureCameraReady();

                console.log("相機已恢復");

            }
            catch(error) {

                console.error(
                    "返回頁面後相機恢復失敗",
                    error
                );

            }

        }

    }
);


/* =======================
   iPhone / Android
   返回網頁事件
======================= */

window.addEventListener(
    "pageshow",
    async function() {

        if (cameraActive && !locked) {

            try {

                await ensureCameraReady();

            }
            catch(error) {

                console.log(error);

            }

        }

    }
);


/* =======================
   選擇標記顏色
======================= */

function selectColor(color, button) {

    selectedColor = color;

    document
        .querySelectorAll(".colorBtn")
        .forEach(btn => {
            btn.classList.remove("selected");
        });

    button.classList.add("selected");

    if (detectedPoints.length > 0 && originalPhoto) {

        drawPoints();

    }

}


/* =======================
   選擇標記大小
======================= */

function selectSize(size, button) {

    selectedSize = size;

    document
        .querySelectorAll(".optionBtn")
        .forEach(btn => {
            btn.classList.remove("selected");
        });

    button.classList.add("selected");

    if (detectedPoints.length > 0 && originalPhoto) {

        drawPoints();

    }

}


/* =======================
   拍照辨識
======================= */

async function capture() {

    if (locked) return;

    if (!cameraActive) {

        alert("請先開啟相機。");

        return;

    }

    locked = true;

    try {

        // 每次拍照都重新確認相機

        await ensureCameraReady();


        /* =======================
           重新取得實際相機尺寸
        ======================= */

        const videoWidth =
        video.videoWidth;

        const videoHeight =
        video.videoHeight;

        console.log(
            "本次拍照相機尺寸:",
            videoWidth,
            videoHeight
        );


        if (!videoWidth || !videoHeight) {

            throw new Error("相機尺寸無效");

        }


        /* =======================
           取得中央正方形
        ======================= */

        const size =
        Math.min(
            videoWidth,
            videoHeight
        );

        const sx =
        (videoWidth - size) / 2;

        const sy =
        (videoHeight - size) / 2;


        /* =======================
           建立 1:1 原始照片
        ======================= */

        originalPhoto =
        document.createElement("canvas");

        originalPhoto.width = size;

        originalPhoto.height = size;

        const photoCtx =
        originalPhoto.getContext("2d");

        photoCtx.drawImage(

            video,

            sx,
            sy,

            size,
            size,

            0,
            0,

            size,
            size

        );


        /* =======================
           檢查照片比例
        ======================= */

        console.log(
            "拍照完成:",
            originalPhoto.width,
            originalPhoto.height
        );

        if (
            originalPhoto.width !==
            originalPhoto.height
        ) {

            throw new Error("照片不是 1:1");

        }


        /* =======================
           Canvas 設定成 1:1
        ======================= */

        canvas.width = size;

        canvas.height = size;

        ctx.drawImage(
            originalPhoto,
            0,
            0
        );


        /* =======================
           清除舊辨識結果
        ======================= */

        detectedPoints = [];

        countElement.innerHTML =
        "AI辨識中...";


        /* =======================
           開始 AI 辨識
        ======================= */

        await detect();

        console.log("AI辨識完成");

    }
    catch(error) {

        console.error(error);

        alert(
            "拍照或 AI 辨識失敗：\n" +
            error.message
        );

    }
    finally {

        locked = false;

    }

}


/* =======================
   重新拍攝
======================= */

function resetCamera() {

    locked = false;

    detectedPoints = [];

    originalPhoto = null;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    countElement.innerHTML =
    "藥品數量:0 顆";

}


/* =======================
   AI 辨識
======================= */

async function detect() {

    const result =
    await runAI(originalPhoto);

    drawResult(result);

}


/* =======================
   ONNX 推論
======================= */

async function runAI(img) {

    const size = 640;

    const c =
    document.createElement("canvas");

    c.width = size;

    c.height = size;

    const cctx =
    c.getContext("2d");

    const scale =
    size / img.width;

    const padX = 0;

    const padY = 0;

    cctx.drawImage(
        img,
        0,
        0,
        size,
        size
    );

    const pix =
    cctx.getImageData(
        0,
        0,
        size,
        size
    );

    const input =
    new Float32Array(
        size * size * 3
    );

    for (
        let i = 0;
        i < size * size;
        i++
    ) {

        input[i] =
        pix.data[i * 4] / 255;

        input[i + size * size] =
        pix.data[i * 4 + 1] / 255;

        input[i + size * size * 2] =
        pix.data[i * 4 + 2] / 255;

    }

    const tensor =
    new ort.Tensor(
        "float32",
        input,
        [1, 3, 640, 640]
    );

    const output =
    await session.run({

        [session.inputNames[0]]:
        tensor

    });

    return {

        output: output.output0,

        scale,

        padX,

        padY

    };

}


/* =======================
   處理辨識結果
======================= */

function drawResult(r) {

    const data =
    r.output.data;

    // 保留原本 YOLO 輸出設定

    const total = 8400;

    const points = [];

    // 信心度門檻 0.5

    for (
        let i = 0;
        i < total;
        i++
    ) {

        const score =
        data[i + total * 4];

        if (score < 0.5) {

            continue;

        }

        points.push({

            x:
            (data[i] - r.padX) / r.scale,

            y:
            (data[i + total] - r.padY) / r.scale,

            w:
            data[i + total * 2] / r.scale,

            h:
            data[i + total * 3] / r.scale,

            score

        });

    }


    /* =======================
       NMS
    ======================= */

    const filtered =
    nms(points, 0.35);

    detectedPoints = filtered;


    /* =======================
       繪製標記
    ======================= */

    drawPoints();


    /* =======================
       顯示數量
    ======================= */

    countElement.innerHTML =
    "藥品數量:" +
    filtered.length +
    " 顆";

}


/* =======================
   畫出標記
======================= */

function drawPoints() {

    if (!originalPhoto) return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // 重新放回乾淨照片

    ctx.drawImage(
        originalPhoto,
        0,
        0,
        canvas.width,
        canvas.height
    );

    // 畫出所有藥品標記

    detectedPoints.forEach(p => {

        ctx.beginPath();

        ctx.arc(

            p.x,

            p.y,

            selectedSize,

            0,

            Math.PI * 2

        );

        ctx.fillStyle =
        selectedColor;

        ctx.fill();

    });

}


/* =======================
   NMS
======================= */

function nms(boxes, t) {

    boxes.sort(
        (a, b) => b.score - a.score
    );

    const result = [];

    while (boxes.length) {

        const best =
        boxes.shift();

        result.push(best);

        boxes =
        boxes.filter(
            b => iou(best, b) < t
        );

    }

    return result;

}


/* =======================
   IOU
======================= */

function iou(a, b) {

    const ax1 = a.x - a.w / 2;
    const ay1 = a.y - a.h / 2;

    const ax2 = a.x + a.w / 2;
    const ay2 = a.y + a.h / 2;

    const bx1 = b.x - b.w / 2;
    const by1 = b.y - b.h / 2;

    const bx2 = b.x + b.w / 2;
    const by2 = b.y + b.h / 2;

    const iw =
    Math.max(
        0,
        Math.min(ax2, bx2) -
        Math.max(ax1, bx1)
    );

    const ih =
    Math.max(
        0,
        Math.min(ay2, by2) -
        Math.max(ay1, by1)
    );

    const inter =
    iw * ih;

    const union =
    a.w * a.h +
    b.w * b.h -
    inter;

    if (union <= 0) return 0;

    return inter / union;

}

</script>

</body>
</html>
